<section class="employees">
    <app-header></app-header>
    <router-outlet></router-outlet>

    <button matButton="outlined"  [routerLink]="'create'" class="button_add">Добавить нового сотрудника</button>
   
    <table mat-table [dataSource]="allEmployeesList()" class="mat-elevation-z8">

        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef> Имя </th>
            <td mat-cell *matCellDef="let element"> {{element.name}} </td>
        </ng-container>

        <ng-container matColumnDef="surname">
            <th mat-header-cell *matHeaderCellDef> Фамилия </th>
            <td mat-cell *matCellDef="let element"> {{element.surname}} </td>
        </ng-container>

        <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef> Email </th>
            <td mat-cell *matCellDef="let element"> {{element.email}} </td>
        </ng-container>

        <ng-container matColumnDef="role">
            <th mat-header-cell *matHeaderCellDef> Роль </th>
            <td mat-cell *matCellDef="let element"> {{element.role}} </td>
        </ng-container>

        <ng-container matColumnDef="specialization">
            <th mat-header-cell *matHeaderCellDef> Направление </th>
            <td mat-cell *matCellDef="let element"> {{element.specialization}} </td>
        </ng-container>

        <ng-container matColumnDef="edit" >
            <th mat-header-cell *matHeaderCellDef class="forIcon" > Изменить </th>
            <td mat-cell *matCellDef="let element"> <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="edit" class="forButtonInTable" (click)="openEdit(element.id)"></mat-icon> </td>
        </ng-container>

        <ng-container matColumnDef="delete">
            <th mat-header-cell *matHeaderCellDef class="forIcon"> Удалить </th>
            <td mat-cell *matCellDef="let element"> <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="delete" class="forButtonInTable" (click)="openDialog(element.name)"></mat-icon> </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>

</section>
