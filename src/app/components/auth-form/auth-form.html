<form [formGroup]="authForm" novalidate class="forAuth">
  <mat-form-field appearance="fill">
    <mat-label>{{ 'enter-login' | translate }}</mat-label>
    <input
      matInput
      placeholder="{{ 'personality.login' | translate }}"
      formControlName="userLogin"
    />
    <mat-icon matSuffix>sentiment_very_satisfied</mat-icon>
    <mat-hint></mat-hint>
  </mat-form-field>

  <mat-form-field>
    <mat-label>{{ 'enter-password' | translate }}</mat-label>
    <input matInput [type]="hide() ? 'password' : 'text'" formControlName="userPassword" />
    <button
      matIconButton
      matSuffix
      (click)="clickEvent($event)"
      [attr.aria-label]="'Hide password'"
      [attr.aria-pressed]="hide()"
    >
      <mat-icon>{{ hide() ? 'visibility_off' : 'visibility' }}</mat-icon>
    </button>
    <mat-hint></mat-hint>
  </mat-form-field>

  <button matButton="tonal" (click)="enter()" [disabled]="authForm.invalid">
    {{ 'button.enter' | translate }}
  </button>
  <mat-icon class="forClose" (click)="onNoClick()">close</mat-icon>
</form>
